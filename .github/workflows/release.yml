name: Release

# 打 v* tag 时构建三平台产物并发布 Release；手动触发只构建、不发布。
# 未签名产物不会伪装成已签名：Release 正文明确写清楚，签名状态由 CI 实际检查。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight (tag / version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
      - name: Version consistency
        run: node scripts/check-version.mjs
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"

  build:
    needs: preflight
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: workbench-windows-x64
          - os: ubuntu-latest
            bundles: deb,appimage
            artifact: workbench-linux-amd64
          - os: macos-latest
            bundles: app,dmg
            artifact: workbench-macos
    runs-on: ${{ matrix.os }}
    env:
      # 更新包签名与系统代码签名是两套东西：这里只保证 Tauri updater 的
      # minisign 校验。系统签名/公证在下面按 secret 是否存在决定。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # secrets 不能直接出现在 step 的 if 表达式里；先落到 env，再用
      # env 判断，既通过 GitHub 的上下文校验，也保留「有凭据才签名」。
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libssl-dev pkg-config
          # AppImage 打包/运行需要 FUSE；24.04 的包名是 libfuse2t64。
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Configure Windows Authenticode (optional)
        if: matrix.os == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "workbench.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}"))
          $secure = ConvertTo-SecureString "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 30 | Set-Content src-tauri/tauri.conf.json
          Write-Host "Authenticode certificate: $($cert.Thumbprint)"

      - run: npm ci

      - name: Build bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          case "${{ matrix.bundles }}" in
            nsis)
              cp src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/ 2>/dev/null || true
              cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig release-assets/ 2>/dev/null || true
              ;;
            deb,appimage)
              cp src-tauri/target/release/bundle/deb/*.deb release-assets/ 2>/dev/null || true
              cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/ 2>/dev/null || true
              cp src-tauri/target/release/bundle/appimage/*.AppImage.sig release-assets/ 2>/dev/null || true
              ;;
            app,dmg)
              cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/ 2>/dev/null || true
              cp src-tauri/target/release/bundle/macos/*.app.tar.gz release-assets/ 2>/dev/null || true
              cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig release-assets/ 2>/dev/null || true
              for d in src-tauri/target/release/bundle/macos/*.app; do
                (cd src-tauri/target/release/bundle/macos && zip -qry "$OLDPWD/release-assets/$(basename "$d" .app).zip" "$(basename "$d")")
              done
              ;;
          esac
          ls -la release-assets

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "package version: $version"

          expect_one() {
            local pattern="$1" label="$2"
            shopt -s nullglob
            local matches=( $pattern )
            shopt -u nullglob
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::期望恰好 1 个 ${label}（${pattern}），实际 ${#matches[@]} 个"
              ls -la release-assets || true
              exit 1
            fi
            FOUND="${matches[0]}"
            local bytes
            bytes=$(wc -c < "$FOUND" | tr -d ' ')
            if [ "$bytes" -le 0 ]; then
              echo "::error::${label} 是空文件：$FOUND"
              exit 1
            fi
            echo "ok ${label}: $FOUND (${bytes} bytes)"
          }

          case "${{ matrix.bundles }}" in
            nsis)
              expect_one "release-assets/*-setup.exe" "NSIS 安装包"
              case "$FOUND" in
                *"$version"*) echo "ok 文件名包含版本号" ;;
                *) echo "::error::NSIS 文件名不含版本 ${version}：$FOUND"; exit 1 ;;
              esac
              expect_one "release-assets/*-setup.exe.sig" "NSIS 更新签名"
              ;;
            deb,appimage)
              expect_one "release-assets/*.deb" "deb 包"
              case "$FOUND" in
                *"$version"*) echo "ok deb 文件名包含版本号" ;;
                *) echo "::error::deb 文件名不含版本 ${version}：$FOUND"; exit 1 ;;
              esac
              expect_one "release-assets/*.AppImage" "AppImage"
              test -x "$FOUND" || { echo "::error::AppImage 不可执行：$FOUND"; exit 1; }
              expect_one "release-assets/*.AppImage.sig" "AppImage 更新签名"
              ;;
            app,dmg)
              app="$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -1 || true)"
              if [ -z "${app}" ] || [ ! -d "${app}" ]; then
                echo "::error::.app 目录不存在"
                ls -la src-tauri/target/release/bundle/macos 2>/dev/null || true
                exit 1
              fi
              if [ ! -s "${app}/Contents/Info.plist" ]; then
                echo "::error::缺少 Info.plist：${app}"
                exit 1
              fi
              exe_name=$(awk '/<key>CFBundleExecutable<\/key>/{getline; gsub(/.*<string>|<\/string>.*/,""); print; exit}' "${app}/Contents/Info.plist")
              if [ -z "${exe_name}" ]; then
                echo "::error::Info.plist 缺少 CFBundleExecutable：${app}"
                exit 1
              fi
              if [ ! -s "${app}/Contents/MacOS/${exe_name}" ]; then
                echo "::error::主程序缺失或为空：${app}/Contents/MacOS/${exe_name}"
                ls -la "${app}/Contents/MacOS" || true
                exit 1
              fi
              echo "ok .app: ${app}（CFBundleExecutable=${exe_name}）"
              expect_one "release-assets/*.dmg" "macOS DMG"
              expect_one "release-assets/*.app.tar.gz" "macOS 更新包"
              expect_one "release-assets/*.app.tar.gz.sig" "macOS 更新签名"
              expect_one "release-assets/*.zip" "macOS 手动下载 zip"
              unzip -l release-assets/*.zip | grep -q "Contents/MacOS/" || {
                echo "::error::zip 内缺少 Contents/MacOS/"
                exit 1
              }
              ;;
            *)
              echo "::error::未知 bundle 类型：${{ matrix.bundles }}"
              exit 1
              ;;
          esac

          for f in release-assets/*; do
            [ -f "$f" ] || continue
            if [ ! -s "$f" ]; then
              echo "::error::空文件：$f"
              exit 1
            fi
          done

      - name: Verify Windows signature (when configured)
        if: matrix.os == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release-assets/*-setup.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') {
            Write-Error "Authenticode 校验失败：$($sig.Status) $($sig.StatusMessage)"
            exit 1
          }
          Write-Host "Authenticode: $($sig.SignerCertificate.Subject) / $($sig.Status)"

      - name: Verify macOS signature (when configured)
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate updater manifest
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/make-latest-json.mjs \
            --assets=release-assets \
            --repo="${{ github.repository }}" \
            --version="$version" \
            --tag="${{ github.ref_name }}" \
            --out=release-assets/latest.json

      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt

          shopt -s nullglob
          assets=()
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS.txt" ] && continue
            [ "$f" = "latest.json" ] && continue
            assets+=("$f")
          done
          shopt -u nullglob

          # Windows 2 + Linux 3 + macOS 4 = 9 个平台产物。
          if [ "${#assets[@]}" -ne 9 ]; then
            echo "::error::期望 9 个平台产物，实际 ${#assets[@]} 个：${assets[*]:-<无>}"
            ls -la
            exit 1
          fi
          for f in "${assets[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::空产物：$f"
              exit 1
            fi
          done

          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          entries=$(wc -l < SHA256SUMS.txt | tr -d ' ')
          if [ "$entries" -ne "${#assets[@]}" ]; then
            echo "::error::SHA256SUMS 条目数 $entries 与产物数 ${#assets[@]} 不一致"
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt

      - name: Build release notes
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cat > release-notes.md <<EOF
          ## Workbench ${version}

          ### Downloads

          | Platform | File | Notes |
          |----------|------|-------|
          | Windows 10/11 x64 | \`Workbench_${version}_x64-setup.exe\` (NSIS) | Code-signed when a certificate secret is configured; otherwise SmartScreen may warn |
          | Linux x64 | \`Workbench_${version}_amd64.deb\` / \`Workbench_${version}_amd64.AppImage\` | AppImage needs a system WebKitGTK 4.1 runtime; the .deb installs dependencies |
          | macOS arm64 | \`Workbench_${version}_aarch64.dmg\` / \`.app.zip\` | Signed and notarized when Apple secrets are configured; otherwise Gatekeeper requires right-click -> Open |

          \`latest.json\` and the \`.sig\` files are the signed update channel. The app
          verifies every update with the built-in minisign public key before installing.

          Verify downloads against \`SHA256SUMS.txt\`.
          EOF
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md
          generate_release_notes: true

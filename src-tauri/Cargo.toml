[package]
name = "workbench"
version = "1.0.0"
description = "Workbench - local-first desktop workbench (Tauri 2 + React 19)"
edition = "2021"
rust-version = "1.95"  # Tauri 2 生态实际要求；1.77 从未被验证过

[lib]
name = "workbench_lib"
path = "src/lib.rs"

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 成本账本改用 SQLite：十万级记录下全量 JSON 读写的瓶颈在解析与 fsync，
# 而不是磁盘吞吐。bundled 编进静态库，Windows/Linux/macOS 都不需系统 libsqlite3。
rusqlite = { version = "0.43", features = ["bundled"] }
sysinfo = "0.39"
# 只对本机服务发 HTTP 请求；用系统 TLS（OpenSSL / SChannel / Security.framework）
# 而不是默认的 rustls+aws-lc：后者要现场编译一整套 BoringSSL，2 核机器上
# 十几分钟起步，安装包也白白变大。系统 TLS 在三平台都现成可用。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
log = "0.4"
fern = "0.7"
chrono = "0.4"
# Anthropic / OpenAI / Gemini 官方标价（带来源与核对日期，无依赖）
llm-prices = "=1.8.0"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = "8"
gray_matter = "0.3.2"
ignore = "0.4.34"
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
schemars = { version = "1.2.3", features = ["derive"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dependencies.tauri]
version = "2"
features = ["tray-icon"]

[dependencies.tauri-plugin-opener]
version = "2"

[dependencies.tauri-plugin-notification]
version = "2"

[dependencies.tauri-plugin-global-shortcut]
version = "2"

[dependencies.tauri-plugin-window-state]
version = "2"

[dependencies.tauri-plugin-autostart]
version = "2"

[dependencies.tauri-plugin-single-instance]
version = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

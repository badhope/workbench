[package]
name = "workbench"
version = "0.8.0"
description = "Workbench - local-first desktop workbench (Tauri 2 + React 19)"
edition = "2021"
rust-version = "1.90"  # Tauri 2 生态实际要求；1.77 从未被验证过

[lib]
name = "workbench_lib"
path = "src/lib.rs"

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 成本账本改用 SQLite：十万级记录下全量 JSON 读写的瓶颈在解析与 fsync，
# 而不是磁盘吞吐。bundled 编进静态库，Windows/Linux/macOS 都不需系统 libsqlite3。
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.39"
reqwest = { version = "0.13", features = ["blocking", "json"] }
log = "0.4"
fern = "0.7"
chrono = "0.4"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rust-embed = "8"

[dependencies.tauri]
version = "2"
features = ["tray-icon"]

[dependencies.tauri-plugin-opener]
version = "2"

[dependencies.tauri-plugin-notification]
version = "2"

[dependencies.tauri-plugin-global-shortcut]
version = "2"

[dependencies.tauri-plugin-window-state]
version = "2"

[dependencies.tauri-plugin-autostart]
version = "2"

[dependencies.tauri-plugin-single-instance]
version = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
